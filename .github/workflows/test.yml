name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The hooks are meant to run on whatever machine a developer uses, so prove
    # they do. Windows is the one that catches line-ending and PATH mistakes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate skill and agent frontmatter
        run: node tests/validate-frontmatter.mjs
      - name: Prove the guard hooks fire
        run: node tests/test-guards.mjs
        shell: bash
      - name: Prove install.sh installs what it claims
        run: node tests/test-install.mjs
        shell: bash
      - name: Prove the plugin manifests agree with the installers
        run: node tests/test-plugin.mjs

  plugin-validate:
    # `claude plugin validate` is the authority on the manifests, and nothing
    # else in this repo can catch a schema change. Without this job a bad edit to
    # .claude-plugin/ stays green here and only fails for someone trying to
    # install the plugin.
    #
    # The manifests are plain JSON and the rest are path-existence checks, so one
    # OS is enough. The cross-platform risk lives in the hooks, and the matrix job
    # above already covers those on all three.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Deliberately unpinned. The plugin directory validates submissions with
      # whatever rules are current, so if a new release of the validator starts
      # rejecting these manifests, this job going red is the signal we want.
      # Finding out from a rejected listing instead is the failure mode.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      # The GitHub runner image ships its own Claude Code, and it wins on PATH
      # over the one just installed — the first version of this job silently
      # validated with 2.1.197 and failed on two fields that 2.1.281 recognises.
      # Resolve the npm-installed binary by path, and assert it is new enough, so
      # that trap announces itself instead of looking like a manifest bug.
      - name: Resolve the validator
        run: |
          echo "PATH claude:   $(command -v claude || echo none)"
          echo "npm prefix -g: $(npm prefix -g)"
          echo "npm root -g:   $(npm root -g)"
          ls -l "$(npm prefix -g)/bin/" | grep -i claude || echo "nothing claude-ish in prefix bin"
          ls -l "$(npm root -g)/@anthropic-ai/claude-code/" 2>/dev/null | head -20 || echo "package not in npm root"
          CLAUDE_BIN="$(npm prefix -g)/bin/claude"
          "$CLAUDE_BIN" --version
          MIN=2.1.281
          GOT="$("$CLAUDE_BIN" --version | cut -d' ' -f1)"
          if [ "$(printf '%s\n%s\n' "$MIN" "$GOT" | sort -V | head -1)" != "$MIN" ]; then
            echo "::error::validator is $GOT, need >= $MIN (directory listing fields are unknown before then)"
            exit 1
          fi
          echo "CLAUDE_BIN=$CLAUDE_BIN" >> "$GITHUB_ENV"
      # --strict turns warnings into failures, which is what the plugin docs
      # recommend for CI. Both manifests are expected to be warning-free.
      - name: Validate the marketplace manifest
        run: |
          "$CLAUDE_BIN" plugin validate . --strict
      - name: Validate the plugin manifest
        run: |
          "$CLAUDE_BIN" plugin validate .claude-plugin/plugin.json --strict
